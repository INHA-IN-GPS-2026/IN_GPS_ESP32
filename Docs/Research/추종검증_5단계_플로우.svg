<svg viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic','Segoe UI',system-ui,sans-serif">
<title>3단계 양산검증 플로우 (Beta → S-H → +adc_cali)</title>
<desc>항온수조 35/55/75℃에서 3단계(Beta, 데이터시트 S-H, +adc_cali) 정확도를 측정하고, temp1-temp2 공차는 어느 단계로도 줄지 않음을 보이는 검증 흐름.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#71717a"/>
</marker>
</defs>
<style>
.box{fill:#f4f4f5;stroke:#d4d4d8;stroke-width:1.5;}
.acc{fill:#eff4ff;stroke:#2563eb;stroke-width:2;}
.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:1.5;}
.t{fill:#18181b;font-size:14.5px;font-weight:600;}
.s{fill:#71717a;font-size:12px;}
.a{fill:#2563eb;font-size:12px;font-weight:600;}
.w{fill:#ea580c;font-size:12.5px;font-weight:600;}
.ln{stroke:#71717a;stroke-width:1.5;}
</style>

<rect class="box" x="240" y="16" width="420" height="48" rx="10"/>
<text class="t" x="450" y="37" text-anchor="middle">① 항온수조 셋업</text>
<text class="s" x="450" y="55" text-anchor="middle">ESP+NTC · 써미스터 PT100 옆 1cm · 교반</text>
<line class="ln" x1="450" y1="64" x2="450" y2="84" marker-end="url(#ar)"/>

<rect class="box" x="170" y="86" width="560" height="52" rx="10"/>
<text class="t" x="450" y="108" text-anchor="middle">② 35 · 55 · 75℃ 각각 열평형 후 로깅</text>
<text class="s" x="450" y="126" text-anchor="middle">temp(또는 raw) + 그때 PV 실측값 · 6~7분 평균 · 40℃ 경보대역 포함</text>
<line class="ln" x1="450" y1="138" x2="450" y2="158" marker-end="url(#ar)"/>

<text class="a" x="450" y="175" text-anchor="middle">동일 데이터에 3단계 적용 — 공통 오차 제거 →</text>

<!-- 3 stages -->
<rect class="box" x="40" y="188" width="250" height="70" rx="10"/>
<text class="t" x="60" y="212">① Beta (현재 B=3492)</text>
<text class="s" x="60" y="231">베이스라인 · 보정 없음</text>
<text class="s" x="60" y="249">예상 ±1~3℃</text>

<line class="ln" x1="290" y1="223" x2="320" y2="223" marker-end="url(#ar)"/>
<rect class="box" x="322" y="188" width="256" height="70" rx="10"/>
<text class="t" x="342" y="212">② S-H (데이터시트 8307)</text>
<text class="s" x="342" y="231">R→T 곡선(공통) · ADC 잔존</text>
<text class="s" x="342" y="249">예상 ±0.5~1.5℃</text>

<line class="ln" x1="578" y1="223" x2="608" y2="223" marker-end="url(#ar)"/>
<rect class="acc" x="610" y="188" width="252" height="70" rx="10"/>
<text class="t" x="630" y="212">③ + adc_cali (칩별·공짜)</text>
<text class="a" x="630" y="231">+ADC 스케일 제거(eFuse)</text>
<text class="s" x="630" y="249">목표 ±0.5℃</text>

<line class="ln" x1="450" y1="258" x2="450" y2="280" marker-end="url(#ar)"/>

<!-- tolerance warning spanning -->
<rect class="warn" x="90" y="282" width="720" height="66" rx="10"/>
<text class="w" x="110" y="304">⚠️ temp1-temp2 공차는 3단계 모두 그대로 (안 줄어듦)</text>
<text class="s" x="110" y="324">공차 = 두 부품의 물리적 저항차(20mV 실측). S-H(공통곡선)·adc_cali(변환보정)는 공통오차만 제거.</text>
<text class="s" x="110" y="341">→ ③ 후 남는 temp1-temp2 차이 = 공차 + S/H 딥. adc_cali가 줄이는 게 아니라 "드러내는" 것.</text>
<line class="ln" x1="450" y1="348" x2="450" y2="370" marker-end="url(#ar)"/>

<rect class="box" x="150" y="372" width="600" height="56" rx="10"/>
<text class="t" x="450" y="395" text-anchor="middle">③ 판정: 각 채널 |오차| ≤ ±0.5℃ AND 공차 잔차 ≤ ±0.5℃ ?</text>
<text class="s" x="450" y="415" text-anchor="middle">성공 → 양산 접근(대당 캘리브 0) 검증 / 초과 → 캡·정밀저항·좁은 부품 추가</text>

<line class="ln" x1="450" y1="428" x2="450" y2="450" marker-end="url(#ar)"/>
<rect class="box" x="120" y="452" width="660" height="70" rx="10" stroke-dasharray="5 4" fill="none"/>
<text class="a" x="140" y="474">양산 배포 (대당 0원) — 03 §5-2</text>
<text class="s" x="140" y="493">데이터시트 S-H(공통) + eFuse adc_cali(칩별·공짜) + 100nF 캡(딥) + ±0.1% 저TCR 저항(분압)</text>
<text class="s" x="140" y="511">공차 실제 감소는 채널별 캘리브(개체별=금본위, 양산 아님) 또는 더 좁은 등급 부품뿐</text>

<rect class="box" x="120" y="536" width="660" height="70" rx="10" stroke-dasharray="5 4" fill="none"/>
<text class="a" x="140" y="558">프로토콜 (§5-1)</text>
<text class="s" x="140" y="577">· 각 점 열평형(PV 설정±0.1 고정 + 센서 &lt;0.05℃/분, 5~10분) 후 기록 · 공칭 아닌 PV 실측</text>
<text class="s" x="140" y="595">· B=3492 세 점 고정 · 가열전용이라 저온(0℃)은 빙수 별도 · 개발용 end-to-end는 04 문서</text>
</svg>
